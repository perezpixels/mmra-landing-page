name: Deploy landing page and web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing page
        run: npm run build
        env:
          # Project Pages sites live at /<repo-name>/
          FIGMA_PUBLIC_URL: /${{ github.event.repository.name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Build web app (Flutter)
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release \
            --base-href /${{ github.event.repository.name }}/app/ \
            --dart-define=LANDING_URL=/${{ github.event.repository.name }}/

      - name: Combine landing page and web app
        run: |
          mkdir -p dist/app
          cp -r app/build/web/. dist/app/
          # Pages has no SPA rewrites; unknown paths fall back to the Flutter app.
          cp dist/app/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
